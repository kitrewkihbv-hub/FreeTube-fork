# Publishes the macOS installers from an existing "Build" workflow run as a GitHub Release.
#
# The upstream "Upload Release" workflow only publishes to the FreeTubeApp/FreeTube
# repository, so this fork needs its own way to hand out ready-to-install builds.
# It does not rebuild anything, it downloads the artifacts of a finished Build run
# and attaches them to a release, which gives plain download links that do not
# require being signed in to GitHub (unlike workflow artifacts).

name: Fork Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        description: Run ID of a finished "Build" workflow run to take the macOS installers from
      tag:
        type: string
        required: true
        description: Tag of the release to create or update (e.g. mac-build-1)

  # `workflow_dispatch` only works once this file is on the default branch, so the
  # workflow is also triggered by touching the marker file. It contains the run ID
  # on the first line and the release tag on the second.
  push:
    branches: [arena/64591193-freetube-with-account]
    paths: [.release-trigger]

cache-mode: none
permissions: {}

jobs:
  release:
    name: Publish macOS installers

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Read the build to publish
      id: target
      shell: bash
      run: |
        if [[ -n "${{ inputs.run_id }}" ]]; then
          echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "run_id=$(sed -n 1p .release-trigger)" >> "$GITHUB_OUTPUT"
          echo "tag=$(sed -n 2p .release-trigger)" >> "$GITHUB_OUTPUT"
        fi

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '*-mac-*'
        merge-multiple: true
        path: assets
        repository: ${{ github.repository }}
        run-id: ${{ steps.target.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # The .7z files are the same app folder as the .zip files, so they are not needed here
    - name: Drop the .7z archives
      shell: bash
      run: |
        rm -f assets/*.7z
        ls -lh assets

    - name: Install ClamAV and update signatures
      run: |
        sudo apt-get update
        sudo apt-get install -y clamav clamav-freshclam unzip
        sudo systemctl stop clamav-freshclam || true
        sudo freshclam

    - name: Scan both macOS app bundles
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(assets/*.zip)
        test "${#zips[@]}" -eq 2
        for zip in "${zips[@]}"; do
          dir="scan/$(basename "$zip" .zip)"
          mkdir -p "$dir"
          unzip -q "$zip" -d "$dir"
          test -d "$dir/MacTube.app"
          archive="$dir/MacTube.app/Contents/Resources/app.asar"
          test -f "$archive"
          npx --yes @electron/asar@3.4.1 extract "$archive" "$dir/app-contents"
        done
        clamscan --recursive --infected --max-filesize=500M --max-scansize=1G scan

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.target.outputs.tag }}
        name: MacTube (${{ steps.target.outputs.tag }})
        body: |
          Build of the `arena/64591193-freetube-with-account` branch, from Build run ${{ steps.target.outputs.run_id }}.

          Changes in this build:
          - Discover uses signed-in YouTube home recommendations and searches based on recent watch history, separate from subscriptions.
          - Subscriptions load more feed pages and can supplement a small feed with uploads from subscribed channels.
          - Removes the dedicated Live discovery tab; live video and chat remain available.
          - The palette opens color theme settings; a separate button switches light and dark.
          - Subscription feed refresh and selection persist, and the picture control adjusts width and height independently.
          - Account imports and subscription synchronization depend on what YouTube returns and can be partial.
          - This build was scanned with ClamAV, which cannot guarantee that software is safe.

          Install on macOS: open the `.dmg` and drag MacTube to Applications.
          MacTube keeps the existing FreeTube data directory to preserve your local library.
          This build is ad-hoc signed and has not been notarized by Apple. Gatekeeper may warn
          that it cannot verify the developer or check the app for malicious software. That
          warning is not a malware finding, but it is also not proof that the app is safe.
          We cannot recommend bypassing Gatekeeper for this build. A warning-free install
          requires an Apple Developer ID-signed and notarized release.

          Apple Silicon Macs use the `arm64` files, Intel Macs use the `x64` files.
        files: assets/*
        fail_on_unmatched_files: true
