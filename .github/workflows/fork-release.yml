# Publishes the macOS installers from an existing "Build" workflow run as a GitHub Release.
#
# The upstream "Upload Release" workflow only publishes to the FreeTubeApp/FreeTube
# repository, so this fork needs its own way to hand out ready-to-install builds.
# It does not rebuild anything, it downloads the artifacts of a finished Build run
# and attaches them to a release, which gives plain download links that do not
# require being signed in to GitHub (unlike workflow artifacts).

name: Fork Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        description: Run ID of a finished "Build" workflow run to take the macOS installers from
      tag:
        type: string
        required: true
        description: Tag of the release to create or update (e.g. mac-build-1)

  # `workflow_dispatch` only works once this file is on the default branch, so the
  # workflow is also triggered by touching the marker file. It contains the run ID
  # on the first line and the release tag on the second.
  push:
    branches: [arena/64591193-freetube-with-account]
    paths: [.release-trigger]

cache-mode: none
permissions: {}

jobs:
  release:
    name: Publish macOS installers

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Read the build to publish
      id: target
      shell: bash
      run: |
        if [[ -n "${{ inputs.run_id }}" ]]; then
          echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "run_id=$(sed -n 1p .release-trigger)" >> "$GITHUB_OUTPUT"
          echo "tag=$(sed -n 2p .release-trigger)" >> "$GITHUB_OUTPUT"
        fi

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '*-mac-*'
        merge-multiple: true
        path: assets
        repository: ${{ github.repository }}
        run-id: ${{ steps.target.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # The .7z files are the same app folder as the .zip files, so they are not needed here
    - name: Drop the .7z archives
      shell: bash
      run: |
        rm -f assets/*.7z
        ls -lh assets

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.target.outputs.tag }}
        name: FreeTube with account sign-in (${{ steps.target.outputs.tag }})
        body: |
          Build of the `arena/64591193-freetube-with-account` branch, from Build run ${{ steps.target.outputs.run_id }}.

          Changes in this build:
          - Sign in with Google/YouTube using the SmartTube-compatible QR flow or the manual code.
            Session tokens are encrypted with the OS keychain when Electron safeStorage supports it.
          - Account status and Google sign-in are visible in the top-right navigation.
          - Signing in imports YouTube subscriptions, recent watch history, custom playlists, Watch Later,
            and liked videos into FreeTube locally. Existing local history and playlist items are preserved;
            these imports do not write anything back to YouTube.
          - Improves compatibility with TV browse response shapes when importing history and playlists.
          - In the watch player, use the overflow menu near subtitles to change video size; the
            setting also has a fine-control slider in Settings → Player.
          - The video title is no longer drawn over the video when it is zoomed into fullscreen.

          Install on macOS: open the `.dmg` and drag FreeTube to Applications.
          This build is ad-hoc signed and has not been notarized by Apple. Gatekeeper may warn
          that it cannot verify the developer or check the app for malicious software. That
          warning is not a malware finding, but it is also not proof that the app is safe.
          We cannot recommend bypassing Gatekeeper for this build. A warning-free install
          requires an Apple Developer ID-signed and notarized release.

          Apple Silicon Macs use the `arm64` files, Intel Macs use the `x64` files.
        files: assets/*
        fail_on_unmatched_files: true
