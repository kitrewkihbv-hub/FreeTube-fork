# Build both Mac installers without using GitHub Actions artifact storage.
# Trigger only by changing this workflow on the session branch.
name: Mac Direct Release

on:
  push:
    branches: [arena/64591193-freetube-with-account]
    paths: [.github/workflows/mac-direct-release.yml]

permissions: {}

jobs:
  mac-release:
    runs-on: macos-15-intel
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
          cache: false
      - name: Install and test
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run lint
          for test in tests/*.cjs; do node "$test"; done
      - name: Build Intel Mac
        run: |
          set -euo pipefail
          pnpm run build
          mkdir -p assets
          cp build/MacTube-0.26.0.dmg assets/
          cp build/MacTube-0.26.0-mac.zip assets/
      - name: Build Apple Silicon Mac
        run: |
          set -euo pipefail
          pnpm run build:arm64
          cp build/MacTube-0.26.0-arm64.dmg assets/
          cp build/MacTube-0.26.0-arm64-mac.zip assets/
      - name: Verify architectures and extract app contents
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then zip=assets/MacTube-0.26.0-mac.zip; expected=x86_64; else zip=assets/MacTube-0.26.0-arm64-mac.zip; expected=arm64; fi
            mkdir -p "scan/$arch"
            if ! ditto -x -k "$zip" "scan/$arch" > "$RUNNER_TEMP/verify.log" 2>&1; then
              echo "::error::Failed to extract $arch ZIP: $(tail -3 "$RUNNER_TEMP/verify.log" | tr '\n' ' ')"; exit 1
            fi
            app="scan/$arch/MacTube.app"
            if [ ! -d "$app" ]; then
              echo "::error::Missing $arch app bundle: $(ls -la "scan/$arch" | tr '\n' ' ')"; exit 1
            fi
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            binary="$app/Contents/MacOS/$executable"
            if [ ! -f "$binary" ]; then echo "::error::Missing $arch executable: $binary"; exit 1; fi
            if ! lipo -archs "$binary" > "$RUNNER_TEMP/verify.log" 2>&1 || ! grep -wq "$expected" "$RUNNER_TEMP/verify.log"; then
              echo "::error::Invalid $arch executable: $(head -5 "$RUNNER_TEMP/verify.log" | tr '\n' ' ')"; exit 1
            fi
            if [ ! -f "$app/Contents/Resources/app.asar" ]; then echo "::error::Missing $arch app.asar"; exit 1; fi
          done
      - name: Upload installers to an unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Experimental local Spotify-style player API: while Music is open, native widgets can use http://127.0.0.1:8765/v1/me/player for playback status and basic playback controls. This is a limited local adapter, not Spotify or Spotify OAuth; Spotify-only track selection, volume and accounts are not supported, and hard-coded Spotify widgets will not automatically work. It rejects browser-origin requests, but local programs can read/control playback without authentication. Never send real Spotify credentials. The older widget API remains unauthenticated with wildcard CORS. Real widgets and Mac playback have not been tested.

          On macOS, the Dynamic Island command file /tmp/mactube_cmd.txt accepts PLAY (toggle), NEXT and PREV for the main window. Any local program running as your user can write commands; the single-slot file can lose rapid writes. NEXT needs a playlist or available recommendations. PREV restarts after four seconds, otherwise uses the playlist or navigates back. Live widget integration has not been tested.

          The macOS Übersicht title file at /tmp/mactube_np.txt now has a fourth thumbnail URL field and is updated on in-page navigation. PLAYING means the window has a nonempty page title, not necessarily that media is playing. Page titles can be recorded outside Music. Opening the thumbnail URL contacts YouTube. The file is removed on window close or quit when possible.

          Account OAuth now normalizes saved expiration data, refreshes before expiry and retries a 401 once, with bounded account fallback attempts. A persistent 401 can still have other causes, and real-account playback and macOS behavior have not been verified.

          Music now has its own dark music-focused interface and searches YouTube Music for songs and music videos. Its 127.0.0.1:8765 desktop-widget API starts only while a Music window is active and stops after the last Music window leaves. While active the API is unauthenticated and allows all web origins: local programs and websites that can reach local-network services may read what is playing or control playback. Previous and shuffle require a playlist. Captions depend on the video and are not guaranteed lyrics. Music search, playback, and widget integration have not been tested live on a Mac.

          Experimental playback first tries an authenticated TV_EMBEDDED player with a Smart TV user agent, matching Web challenge visitor and proof token. It then falls back to anonymous WEB_EMBEDDED, ANDROID_VR and the existing Web path. Authenticated player requests disclose the video ID to YouTube even if Remember Watch History is disabled. YouTube may reject this client, OAuth pairing, embed identity or token; real playback and macOS behavior have not been verified.

          Optional YouTube watch reporting uses the authenticated TV session with tracking URLs supplied by the chosen player (or same-video Web response). Those URLs may be missing, rejected, or ignored, so account history is not guaranteed. Local history remains separate.

          The Mac app bundles and extracted app archives were scanned with ClamAV; a scan cannot guarantee safety. These builds are ad-hoc signed and not notarized by Apple, so Gatekeeper may warn that Apple cannot verify the app. Such a warning is neither proof of malware nor proof of safety. We cannot recommend bypassing Gatekeeper; a warning-free install requires a Developer ID-signed and notarized release.

          Download arm64 for Apple Silicon, or the file without arm64 for Intel. MacTube shares the existing FreeTube data directory, so back up your data before upgrading.
          NOTES
          gh release create mac-build-32 assets/MacTube-0.26.0.dmg assets/MacTube-0.26.0-arm64.dmg assets/MacTube-0.26.0-mac.zip assets/MacTube-0.26.0-arm64-mac.zip --draft --target "$GITHUB_SHA" --title 'MacTube (mac-build-32)' --notes-file "$RUNNER_TEMP/release-notes.md"

  scan-and-publish:
    needs: mac-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Download draft app bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download mac-build-32 --pattern '*.zip' --dir assets
          test -f assets/MacTube-0.26.0-mac.zip
          test -f assets/MacTube-0.26.0-arm64-mac.zip
      - name: Install ClamAV and update signatures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam unzip
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Extract and scan both app bundles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asar-tool"
          npm install --prefix "$RUNNER_TEMP/asar-tool" --ignore-scripts @electron/asar@3.4.1
          for zip in assets/*.zip; do
            dir="scan/$(basename "$zip" .zip)"
            mkdir -p "$dir"
            unzip -q "$zip" -d "$dir"
            archive="$dir/MacTube.app/Contents/Resources/app.asar"
            test -f "$archive"
            node "$RUNNER_TEMP/asar-tool/node_modules/@electron/asar/bin/asar.js" extract "$archive" "$dir/app-contents"
          done
          clamscan --recursive --infected --max-filesize=500M --max-scansize=1G scan
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit mac-build-32 --draft=false
